name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'const p=require("./package.json");if(process.env.GITHUB_REF_NAME!=="v"+p.version)process.exit(1)'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify application
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verify.log
      - name: Report verification failure
        if: failure()
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync } from 'node:fs';
          if (existsSync('verify.log')) {
            const log = readFileSync('verify.log', 'utf8').slice(-60000);
            console.log('::error title=Verification diagnostics::' + log.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A'));
          }
          JS
      - name: Upload regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics
          path: |
            verify.log
            artifacts/playwright/
      - run: npm run test:package
      - run: npm run build:relay
      - run: SESSIONDECK_FRP_PLATFORMS=linux_amd64 npm run prepare:relay-clients
      - run: npm run package:release
      - uses: actions/upload-artifact@v4
        with:
          name: dili-release-packages
          path: dist/releases/*
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/releases/*.tar.gz
            dist/releases/*.tgz
            dist/releases/SHA256SUMS
