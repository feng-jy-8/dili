name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run preflight
      - run: npx playwright install --with-deps chromium
      - name: Verify application
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verify.log
      - name: Report verification failure
        if: failure()
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync } from 'node:fs';
          if (existsSync('verify.log')) {
            const log = readFileSync('verify.log', 'utf8').slice(-3500);
            console.log('::error title=Verification diagnostics::' + log.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A'));
          }
          JS
      - name: Upload regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics
          path: |
            verify.log
            artifacts/playwright/
      - run: npm run test:package
