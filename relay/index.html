<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dili · 远程配对</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#252b35;font:14px/1.6 system-ui,-apple-system,sans-serif}main{max-width:780px;margin:48px auto;padding:0 20px}h1{font-size:24px;margin:0}h2{font-size:17px;margin:0 0 14px}p,small{color:#747d8c}.panel{background:white;border:1px solid #e8ebef;border-radius:10px;padding:24px;margin:20px 0}label{display:block;margin:12px 0}input,select,textarea{width:100%;border:1px solid #d5dbe3;border-radius:6px;padding:9px;font:inherit}button{border:0;border-radius:6px;padding:9px 14px;font:inherit;cursor:pointer;background:#3370ff;color:white}button:disabled{opacity:.5;cursor:wait}.secondary{background:#edf1f6;color:#252b35}.row{display:flex;gap:12px;align-items:end}.row label{flex:1}textarea{height:100px;resize:vertical;word-break:break-all}li{list-style:none;padding:12px 0;border-bottom:1px solid #e8ebef;display:flex;gap:12px;align-items:center}li>div{flex:1;min-width:0}ul{padding:0;margin:0}a{color:#3370ff;overflow-wrap:anywhere}#error{color:#c33;white-space:pre-wrap}[hidden]{display:none!important}@media(max-width:500px){main{margin:24px auto}.panel{padding:16px}.row{flex-wrap:wrap}.row label{min-width:140px}}
</style></head><body><main>
<h1>Dili · 远程配对</h1><p>生成邀请码，在本机 Dili（嘀哩工作台）中粘贴，即可获得远程访问链接。</p>
<section class="panel" id="login"><h2>服务器管理</h2><form id="loginForm"><label>管理密钥<input id="key" type="password" autocomplete="current-password" required></label><button>进入管理</button></form><small>管理密钥保存在服务器的 admin.token 文件。只提供给服务器所有者。</small></section>
<p id="error" role="alert"></p>
<div id="management" hidden><section class="panel"><h2>生成邀请码</h2><form id="inviteForm"><div class="row"><label>访问域名<select id="domain" aria-label="访问域名"></select></label><label>备注（可选）<input id="label" maxlength="80" placeholder="例如：我的开发电脑"></label><label>有效期<select id="hours"><option value="1">1 小时</option><option value="24" selected>24 小时</option><option value="168">7 天</option><option value="permanent">永不过期</option></select></label><button>生成邀请码</button></div></form><p><small>默认域名为 discoverpaw.com；其他域名需先加入中继服务白名单。</small></p><div id="result" hidden><p>每个邀请码只能配对一台设备，复制后到本机「连接与能力 → 远程访问」粘贴。</p><textarea id="code" readonly aria-label="邀请码"></textarea><button id="copy">复制邀请码</button><p id="expiry"></p></div></section>
<section class="panel"><h2>已配对设备</h2><ul id="devices"></ul></section><section class="panel"><h2>邀请码记录</h2><ul id="invites"></ul><small>邀请码只在生成时显示。丢失时可撤销后重新生成。</small></section><button id="logout" class="secondary">退出管理</button></div>
</main><script>
let token='',busy=false;const $=id=>document.getElementById(id);
async function call(path,body,method){const response=await fetch('/connect/api/admin'+path,{method:method||(body===undefined?'GET':'POST'),headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:body===undefined?undefined:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.error||'请求失败');return data}
async function action(fn){if(busy)return;busy=true;$('error').textContent='';document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){$('error').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function item(parent,title,detail,buttonLabel,onClick,url){const li=document.createElement('li'),content=document.createElement('div'),name=document.createElement('strong'),note=document.createElement('small');name.textContent=title;note.textContent=detail;content.append(name,document.createElement('br'),note);if(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noreferrer';a.textContent='打开远程工作台';content.append(document.createElement('br'),a)}li.append(content);if(onClick){const b=document.createElement('button');b.className='secondary';b.textContent=buttonLabel;b.onclick=()=>action(onClick);li.append(b)}parent.append(li)}
async function refresh(){const data=await call('/state');const domains=data.domains||['discoverpaw.com'];const selected=$('domain').value;$('domain').replaceChildren(...domains.map(value=>{const option=document.createElement('option');option.value=value;option.textContent=value;return option}));if(domains.includes(selected))$('domain').value=selected;$('devices').replaceChildren();$('invites').replaceChildren();if(!data.devices.length)item($('devices'),'尚无设备','先生成邀请码，在本机完成配对。');for(const d of data.devices)item($('devices'),d.name,(d.revokedAt?'已撤销':d.connected?'已连接':'未连接')+' · '+new Date(d.createdAt).toLocaleString(),'撤销',d.revokedAt?null:async()=>{if(confirm('撤销这台设备的中继访问？')){await call('/devices/'+d.id,{},'DELETE');await refresh()}},d.revokedAt?null:location.origin+'/connect/d/'+d.id+'/');for(const i of data.invites){const expiry=i.expiresAt?('到期 '+new Date(i.expiresAt).toLocaleString()):'永不过期';item($('invites'),i.label||'邀请码',(i.revokedAt?'已撤销':i.usedAt?'已使用':i.expiresAt&&Date.parse(i.expiresAt)<Date.now()?'已过期':'待使用')+' · '+expiry,'撤销',i.revokedAt||i.usedAt?null:async()=>{await call('/invites/'+i.id,{},'DELETE');await refresh()})}}
$('loginForm').onsubmit=e=>{e.preventDefault();action(async()=>{token=$('key').value.trim();await refresh();$('key').value='';$('login').hidden=true;$('management').hidden=false})};
$('inviteForm').onsubmit=e=>{e.preventDefault();action(async()=>{const permanent=$('hours').value==='permanent';const data=await call('/invites',{domain:$('domain').value,label:$('label').value, ...(permanent?{permanent:true}:{hours:Number($('hours').value)})});$('code').value=data.invite;$('expiry').textContent=data.expiresAt?'到期：'+new Date(data.expiresAt).toLocaleString():'有效期：永不过期';$('result').hidden=false;await refresh()})};
$('copy').onclick=()=>action(async()=>{try{await navigator.clipboard.writeText($('code').value);$('copy').textContent='已复制'}catch{$('code').focus();$('code').select();$('error').textContent='请复制已选中的邀请码'}});
$('logout').onclick=()=>{token='';$('code').value='';$('result').hidden=true;$('management').hidden=true;$('login').hidden=false;$('devices').replaceChildren();$('invites').replaceChildren()};setInterval(()=>{if(token&&!busy)action(refresh)},15000);
</script></body></html>
